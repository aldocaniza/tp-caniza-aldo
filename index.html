<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de episodios de Rick and Morty</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>Explorador de episodios de Rick and Morty</h1>
    <p class="encabezado__subtitulo">Buscá por nombre y temporada</p>
  </header>

  <main class="contenido">
    <form id="formulario-busqueda" class="buscador">
      <div class="campo">
        <label for="nombre">Nombre del episodio</label>
        <input type="search" id="nombre" name="nombre" placeholder="Pickle">
      </div>
      <div class="campo">
        <label for="temporada">Temporada</label>
        <select id="temporada" name="temporada">
          <option value="">Todas</option>
          <option value="S01">S01</option>
          <option value="S02">S02</option>
          <option value="S03">S03</option>
          <option value="S04">S04</option>
          <option value="S05">S05</option>
        </select>
      </div>
      <button type="submit" id="boton-buscar">Buscar</button>
    </form>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

    <section id="resultados" class="rejilla" aria-label="Resultados de la búsqueda"></section>
  </main>

  <footer class="pie">
    <p>Aldo Cañiza · Cédula 3636539 · Variante C — Episodios · Versión 1.1</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
